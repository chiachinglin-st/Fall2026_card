<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Card Project v1.0</title>
        <!-- 1. External Icon Library (Font Awesome) FIRST -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <!-- 2. Internal stylesheet must be last so it can override external styles -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="card">
            <div class="left-info">
                <p id="user-level">Level 14</p>
                <img src="https://cdn-icons-png.flaticon.com/512/147/147144.png" alt="male with bread">
                <p id="user-point">7,989 points</p>
            </div>
            <div class="right-info">
                <header>
                    <h1>John Doe</h1>
                </header>
                <p id="user-description">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce a volutpat mauris, at molestie lacus. Nam vestibulum sodales odio ut pulvinar.
                </p>
                <div class="linkedin-link">
                    <a href="https://www.linkedin.com/" target="_blank">
                        <i class="fa fa-linkedin-square"></i>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
